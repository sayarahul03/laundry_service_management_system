<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders | FreshFold</title>
<link rel="stylesheet" href="css/style.css"></head>
<body>
<div id="navbar"></div>
<section class="section"><div class="container">
  <h2>Orders</h2><p class="sub">Create orders and move them through each stage.</p>
  <div class="toolbar">
    <select id="filter" aria-label="Filter by status"><option value="">All statuses</option></select>
    <button class="btn" id="add">New order</button>
  </div>
  <div class="table-wrap"><table>
    <thead><tr><th>Order</th><th>Customer</th><th>Service</th><th>Weight</th><th>Date</th><th>Total</th><th>Status</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
</div></section>
<div id="footer"></div>
<script src="js/main.js"></script>
<script>
let orders = [];
const filter = document.getElementById('filter');
filter.innerHTML += ORDER_STATUSES.map(s => `<option>${s}</option>`).join('');

async function load() { orders = await api('/orders'); render(); }
function render() {
  const list = orders.filter(o => !filter.value || o.status === filter.value);
  document.getElementById('rows').innerHTML = list.map(o => `
    <tr><td>#${o.order_id}</td><td>${esc(o.customer_name)}</td><td>${esc(o.service_name)}</td>
    <td>${o.clothes_weight} kg</td><td>${o.order_date}</td><td>${rupees(o.total_amount)}</td>
    <td><select onchange="setStatus(${o.order_id}, this.value)" aria-label="Status of order ${o.order_id}">
      ${ORDER_STATUSES.map(s => `<option ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}</select></td>
    <td><button class="btn btn-danger btn-sm" onclick="remove(${o.order_id})">Delete</button></td></tr>`).join('')
    || '<tr><td colspan="8" class="empty">No orders found.</td></tr>';
}
async function setStatus(id, status) {
  try { await api('/orders/' + id + '/status', { method: 'PATCH', body: { status } }); toast('Order #' + id + ' is now ' + status); load(); }
  catch (e) { toast(e.message, true); }
}
async function remove(id) {
  if (!confirm('Delete order #' + id + ' and its payment record?')) return;
  try { await api('/orders/' + id, { method: 'DELETE' }); toast('Order deleted'); load(); } catch (e) { toast(e.message, true); }
}
async function newOrder() {
  const [customers, services] = await Promise.all([api('/customers'), api('/services')]);
  if (!customers.length || !services.length) return toast('Add at least one customer and one service first.', true);
  openForm({
    title: 'New order',
    fields: [
      { name: 'customer_id', label: 'Customer', type: 'select', options: customers.map(c => ({ value: c.customer_id, label: c.name + ' (' + c.phone + ')' })) },
      { name: 'service_id', label: 'Service', type: 'select', options: services.map(s => ({ value: s.service_id, label: s.service_name + ' - ' + rupees(s.price_per_kg) + '/kg' })) },
      { name: 'clothes_weight', label: 'Weight of clothes (kg)', type: 'number', step: '0.5', required: true }
    ],
    values: { clothes_weight: 1 },
    note: v => {
      const s = services.find(x => x.service_id == v.service_id);
      return 'Estimated total: <strong>' + rupees(s ? s.price_per_kg * (parseFloat(v.clothes_weight) || 0) : 0) + '</strong>';
    },
    onSave: async v => { const r = await api('/orders', { method: 'POST', body: v }); toast('Order #' + r.order_id + ' created'); load(); }
  });
}
document.getElementById('add').onclick = () => newOrder().catch(e => toast(e.message, true));
filter.onchange = render;
load().then(() => { if (new URLSearchParams(location.search).get('new')) newOrder(); }).catch(e => toast(e.message, true));
</script>
</body></html>
